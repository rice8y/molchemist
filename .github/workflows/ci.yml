name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  quality:
    name: Quality and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.86
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p molchemist-core --features native-layout --locked
      - run: ./scripts/check-wasm-sync.sh
      - run: ./scripts/check-licenses.sh
      - run: cargo package -p molchemist-cli --locked

  rendering:
    name: Typst rendering (${{ matrix.typst }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        typst: ["0.14.0", "0.14.1", "0.14.2", "0.15.0", "0.15.1"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ matrix.typst }}
          cache-dependency-path: package/lib.typ
      - name: Compile rendering fixtures
        run: cargo test --locked -p molchemist-cli --test cli -- --ignored
      - name: Check Typst and CLI parity
        run: cargo test --locked -p molchemist-cli --test wasm_parity typst_and_cli_outputs_match_exactly -- --ignored
